<!DOCTYPE html><html lang="en"><head><title>Collector - CleanTrack</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"><script src="js/theme.js"></script></head><body>
<div id="nav"></div><div class="container py-4"><h4 class="mb-3"><i class="bi bi-truck text-green"></i> My Assigned Complaints</h4><div id="list">Loading...</div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/app.js"></script><script>
function card(c) { const btn = c.status === 'ASSIGNED' ? '<button class="btn btn-primary btn-sm" onclick="setS(' + c.id + ',\'IN_PROGRESS\')">Start Work</button>'
  : c.status === 'IN_PROGRESS' ? '<button class="btn btn-success btn-sm" onclick="setS(' + c.id + ',\'RESOLVED\')">Mark Resolved</button>' : '';
  return `<div class="card p-3 mb-3"><div class="d-flex justify-content-between"><strong>#${c.id} <i class="bi bi-geo-alt"></i> ${esc(c.location)}</strong>${badge(c.status)}</div>
  <p class="my-2">${esc(c.description)}</p><div class="mb-2">${tracker(c.status)}</div>
  <small class="text-muted">Reported by ${esc(c.user.name)} on ${fmt(c.createdAt)}</small><div class="mt-2">${btn}</div></div>`; }
async function load() { try { const l = await api('/collector/complaints'); list.innerHTML = l.length ? l.map(card).join('') : empty('bi-inbox', 'No complaints assigned to you yet'); } catch (e) { toast(e.message, 'danger'); } }
async function setS(id, s) { try { await api('/collector/complaints/' + id + '/status?status=' + s, 'PUT'); toast('Status updated'); load(); } catch (e) { toast(e.message, 'danger'); } }
if (guard('COLLECTOR')) load();
</script></body></html>
