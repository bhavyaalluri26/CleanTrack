<!DOCTYPE html><html lang="en"><head><title>Login - CleanTrack</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"><script src="js/theme.js"></script></head><body>
<div class="container"><div class="card auth-card p-4"><div class="text-end"><button type="button" class="btn btn-outline-secondary btn-sm theme-toggle" onclick="toggleTheme()"></button></div><h3 class="text-center text-green fw-bold"><i class="bi bi-recycle"></i> CleanTrack</h3>
<p class="text-center text-muted" id="sub">Login to your account</p><div id="err" class="alert alert-danger d-none"></div>
<form id="f"><input id="email" type="email" class="form-control mb-3" placeholder="Email" required>
<input id="pw" type="password" class="form-control mb-3" placeholder="Password" required>
<button id="b" class="btn btn-success w-100">Login</button></form>
<p class="text-center mt-3 mb-0 small">New user? <a href="register.html">Register</a> | <a href="index.html">Home</a></p></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/app.js"></script><script>
const ROLES = {USER:'User', ADMIN:'Admin', COLLECTOR:'Collector'};
const wanted = new URLSearchParams(location.search).get('role');
if (ROLES[wanted]) sub.textContent = ROLES[wanted] + ' login';
f.onsubmit = async e => { e.preventDefault(); err.classList.add('d-none'); b.disabled = true; b.textContent = 'Logging in...';
  try { const u = await login(email.value, pw.value);
    if (ROLES[wanted] && u.role !== wanted) { sessionStorage.clear(); throw new Error('This account is not a ' + ROLES[wanted] + ' account. Please use the correct login option.'); }
    location = homeOf(u); }
  catch (x) { err.textContent = x.message; err.classList.remove('d-none'); b.disabled = false; b.textContent = 'Login'; } };
</script></body></html>
