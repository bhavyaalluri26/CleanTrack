<!DOCTYPE html><html lang="en"><head><title>Register - CleanTrack</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"><script src="js/theme.js"></script></head><body>
<div class="container"><div class="card auth-card p-4"><div class="text-end"><button type="button" class="btn btn-outline-secondary btn-sm theme-toggle" onclick="toggleTheme()"></button></div><h3 class="text-center text-green fw-bold"><i class="bi bi-recycle"></i> CleanTrack</h3>
<p class="text-center text-muted">Create a citizen account</p><div id="err" class="alert alert-danger d-none"></div>
<form id="f"><input id="name" class="form-control mb-3" placeholder="Full name" required>
<input id="email" type="email" class="form-control mb-3" placeholder="Email" required>
<input id="pw" type="password" class="form-control mb-3" placeholder="Password (min 6 characters)" required>
<button id="b" class="btn btn-success w-100">Register</button></form>
<p class="text-center mt-3 mb-0 small">Already registered? <a href="login.html">Login</a></p></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/app.js"></script><script>
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();

  const err = document.getElementById('err');
  const button = document.getElementById('b');
  const fullName = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('pw').value;

  err.classList.add('d-none');
  button.disabled = true;

  try {
    await api('/auth/register', 'POST', {
      name: fullName,
      email: email,
      password: password
    });

    const u = await login(email, password);
    location.href = homeOf(u);
  } catch (x) {
    err.textContent = x.message;
    err.classList.remove('d-none');
    button.disabled = false;
  }
};
</script>
