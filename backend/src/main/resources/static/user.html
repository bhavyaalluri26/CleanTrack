<!DOCTYPE html><html lang="en"><head><title>My Dashboard - CleanTrack</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"><script src="js/theme.js"></script></head><body>
<div id="nav"></div><div class="container py-4"><div class="row g-4">
<div class="col-lg-4"><div class="card p-4"><h5 class="mb-3"><i class="bi bi-pencil-square text-green"></i> New Complaint</h5>
<form id="f"><textarea id="desc" class="form-control mb-3" rows="4" maxlength="1000" placeholder="Describe the problem (e.g. overflowing bin)" required></textarea>
<input id="loc" class="form-control mb-3" placeholder="Location / address" required><button id="b" class="btn btn-success w-100">Submit Complaint</button></form></div></div>
<div class="col-lg-8"><h5>Active Complaints</h5><div id="active" class="mb-4"><div class="text-muted">Loading...</div></div>
<h5>Complaint History</h5><div id="hist"></div></div></div></div>
<div class="modal fade" id="fm"><div class="modal-dialog"><div class="modal-content p-3"><h5>Give Feedback</h5>
<select id="rate" class="form-select my-3"><option value="5">5 - Excellent</option><option value="4">4 - Good</option><option value="3">3 - Average</option><option value="2">2 - Poor</option><option value="1">1 - Very poor</option></select>
<textarea id="cm" class="form-control mb-3" placeholder="Comment (optional)"></textarea><button class="btn btn-success" onclick="sendFb()">Submit</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/app.js"></script><script>
let fid = null, modal;
function card(c) { return `<div class="card p-3 mb-3"><div class="d-flex justify-content-between"><strong>#${c.id} ${esc(c.location)}</strong>${badge(c.status)}</div>
 <p class="my-2">${esc(c.description)}</p><div class="mb-2">${tracker(c.status)}</div>
 <small class="text-muted">${fmt(c.createdAt)}${c.collector ? ' | Collector: ' + esc(c.collector.name) : ''}</small>
 ${c.feedback ? '<div class="mt-2 small text-green"><i class="bi bi-star-fill"></i> Rated ' + c.feedback.rating + '/5 ' + esc(c.feedback.comment) + '</div>'
  : c.status === 'RESOLVED' ? '<button class="btn btn-outline-success btn-sm mt-2" onclick="openFb(' + c.id + ')">Give Feedback</button>' : ''}</div>`; }
async function load() {
  try { const l = await api('/complaints/my'); const a = l.filter(c => c.status !== 'RESOLVED'), h = l.filter(c => c.status === 'RESOLVED');
    active.innerHTML = a.length ? a.map(card).join('') : empty('bi-inbox', 'No active complaints');
    hist.innerHTML = h.length ? h.map(card).join('') : empty('bi-clock-history', 'No resolved complaints yet'); }
  catch (e) { toast(e.message, 'danger'); } }
f.onsubmit = async e => { e.preventDefault(); b.disabled = true;
  try { await api('/complaints', 'POST', {description: desc.value, location: loc.value}); f.reset(); toast('Complaint submitted'); load(); }
  catch (x) { toast(x.message, 'danger'); } b.disabled = false; };
function openFb(id) { fid = id; modal = modal || new bootstrap.Modal(document.getElementById('fm')); modal.show(); }
async function sendFb() { try { await api('/complaints/' + fid + '/feedback', 'POST', {rating: +rate.value, comment: cm.value}); modal.hide(); toast('Thank you for your feedback'); load(); }
  catch (e) { toast(e.message, 'danger'); } }
if (guard('USER')) load();
</script></body></html>
