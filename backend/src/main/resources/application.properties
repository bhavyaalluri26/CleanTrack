# ===== CONFIGURE YOUR MYSQL USERNAME / PASSWORD HERE =====
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cleantrack_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
server.port=${PORT:8080}